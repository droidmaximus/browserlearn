<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserLearn</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>BrowserLearn</h1>
    <p id="status">Loading…</p>
    <label>Recording name <input id="name" placeholder="Create invoice" /></label>
    <button id="record" type="button">Record</button>
    <button id="stop" type="button" hidden>Stop</button>
    <hr />
    <label>Pairing code <input id="token" type="password" autocomplete="off" /></label>
    <label>Port <input id="port" type="number" value="7420" min="1" max="65535" /></label>
    <button id="save" type="button">Save pairing</button>
    <script src="popup.js"></script>
  </body>
</html>
